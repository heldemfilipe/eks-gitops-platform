# Teste de negação (Etapa 3): um ExternalSecret fora do namespace permitido tenta ler o mesmo segredo.
# Não faz parte do GitOps de propósito: aplicado e removido à mão.
apiVersion: v1
kind: Namespace
metadata:
  name: intruso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tentativa
  namespace: intruso
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-fake
  target:
    name: roubado
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: eks-lab/pedidos/mongodb-uri
